# Manual deploy only — does NOT run on push, PR, or schedule.
name: Deploy to S3 + CloudFront

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and deploy
        required: true
        default: main
        type: string

concurrency:
  group: deploy-s3-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    # Safety guard: never deploy unless explicitly triggered from Actions UI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Resolve env (.env first, then GitHub secrets)
        env:
          SEC_REACT_APP_BACKEND_BASE_URL: ${{ secrets.REACT_APP_BACKEND_BASE_URL }}
          SEC_REACT_APP_PYTHON_API_BASE_URL: ${{ secrets.REACT_APP_PYTHON_API_BASE_URL }}
          SEC_REACT_APP_GOOGLE_MAP_API: ${{ secrets.REACT_APP_GOOGLE_MAP_API }}
          SEC_REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          SEC_AWS_REGION: ${{ secrets.AWS_REGION }}
          SEC_S3_BUCKET: ${{ secrets.S3_BUCKET }}
          SEC_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          resolve_var() {
            key="$1"
            secret="$2"
            file_val=""

            if [ -f .env ]; then
              file_val=$(grep -E "^${key}=" .env | tail -n1 | cut -d= -f2- \
                | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" | tr -d '\r')
            fi

            if [ -n "$file_val" ]; then
              echo "Using .env for ${key}"
              echo "${key}=${file_val}" >> "$GITHUB_ENV"
            elif [ -n "$secret" ]; then
              echo "Using GitHub secret for ${key}"
              echo "${key}=${secret}" >> "$GITHUB_ENV"
            else
              echo "::warning::${key} is not set in .env or GitHub secrets"
            fi
          }

          resolve_var REACT_APP_BACKEND_BASE_URL "$SEC_REACT_APP_BACKEND_BASE_URL"
          resolve_var REACT_APP_PYTHON_API_BASE_URL "$SEC_REACT_APP_PYTHON_API_BASE_URL"
          resolve_var REACT_APP_GOOGLE_MAP_API "$SEC_REACT_APP_GOOGLE_MAP_API"
          resolve_var REACT_APP_STRIPE_PUBLISHABLE_KEY "$SEC_REACT_APP_STRIPE_PUBLISHABLE_KEY"
          resolve_var AWS_REGION "$SEC_AWS_REGION"
          resolve_var S3_BUCKET "$SEC_S3_BUCKET"
          resolve_var CLOUDFRONT_DISTRIBUTION_ID "$SEC_CLOUDFRONT_DISTRIBUTION_ID"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # CRA treats ESLint warnings as errors when CI=true; repo has existing warnings
          CI: false
          REACT_APP_BACKEND_BASE_URL: ${{ env.REACT_APP_BACKEND_BASE_URL }}
          REACT_APP_PYTHON_API_BASE_URL: ${{ env.REACT_APP_PYTHON_API_BASE_URL }}
          REACT_APP_GOOGLE_MAP_API: ${{ env.REACT_APP_GOOGLE_MAP_API }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ env.REACT_APP_STRIPE_PUBLISHABLE_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build to S3
        run: |
          aws s3 sync build/ "s3://${S3_BUCKET}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.html"
          aws s3 sync build/ "s3://${S3_BUCKET}/" \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" \
            --include "index.html" \
            --include "*.html"
        env:
          S3_BUCKET: ${{ env.S3_BUCKET }}

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
